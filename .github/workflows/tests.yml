name: tests

# Runs on the staging branch and on any PR into main, so a change has to prove
# itself before it can be merged.
on:
  push:
    branches: [main, "claude/**", staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs twice — once on SQLite, once against this Postgres — so the
    # two storage backends can't drift apart unnoticed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dojo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOJO_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/dojo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests (SQLite and Postgres)
        run: python -m pytest tests/ -q

      # Catches syntax errors and bad imports in the UI modules, which the unit
      # tests deliberately do not touch (importing them needs a Streamlit
      # runtime). A typo in theme.py would otherwise only show up in the browser.
      - name: Byte-compile every module
        run: python -m compileall -q app.py dojo tests

      - name: Import the non-UI modules
        run: python -c "import dojo.config, dojo.db, dojo.gamify, dojo.nlp, dojo.ai; print('imports ok')"
