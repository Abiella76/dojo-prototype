# One theme, declared once. The app's identity is a dark console look, so it no
# longer follows the system's light/dark preference — a light variant of this
# palette would be a different product. dojo/ui/theme.py mirrors these values
# for the custom markup.
[theme]
base = "dark"
backgroundColor = "#070710"
secondaryBackgroundColor = "#0e0e1b"
textColor = "#eef0f8"
borderColor = "#23233d"
primaryColor = "#8b7bff"
linkColor = "#22d3ee"
codeBackgroundColor = "#16162b"
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"

[server]
headless = true

[browser]
gatherUsageStats = false
